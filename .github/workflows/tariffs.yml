# בדיקה אוטומטית של ספר לוחות התעריפים של רשות החשמל.
# אם יצא עדכון – data/tariffs.json מתעדכן ונדחף אוטומטית, והאפליקציה
# מקבלת אותו בפתיחה הבאה בלי שהמשתמש עושה דבר.
# אם הפענוח נכשל או שהערכים לא הגיוניים – שום דבר לא משתנה, וההרצה נכשלת
# כדי ש‑GitHub ישלח התראה במייל.

name: עדכון תעריפים

on:
  schedule:
    # ארבעה מועדים ביום, ולא אחד.
    #
    # הסיבה: GitHub אינו מתחייב להריץ משימה מתוזמנת. התיעוד מזהיר מעיכובים
    # בעומס, ובפועל ב‑07/10/2026 המועד היומי לא רץ כלל – לא נוצרה אפילו
    # רשומת הרצה. מועד יחיד ביום פירושו שהחמצה אחת מוחקת יום שלם.
    # ארבעה מועדים בלתי תלויים: מספיק שאחד מהם ישרוד כדי שהיום ייבדק.
    #
    # הדקות אינן עגולות ואינן זהות זו לזו, כי תחילת כל שעה היא זמן העומס
    # שבו הרצות מתוזמנות נדחות ונזרקות.
    - cron: "23 3 * * *"       # 06:23 שעון ישראל
    - cron: "11 9 * * *"       # 12:11
    - cron: "37 14 * * *"      # 17:37
    - cron: "49 19 * * *"      # 22:49
  workflow_dispatch:
    inputs:
      url:
        description: "כתובת ספר תעריפים מפורשת (לא חובה)"
        required: false

permissions:
  contents: write

# אם מועד אחד נדחה ומתנגש עם הבא אחריו, אין טעם ששתי בדיקות יכתבו
# לאותו קובץ במקביל. השנייה תמתין ותרוץ על המצב המעודכן.
concurrency:
  group: tariffs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: התקנת poppler (pdftotext)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # תאריך הבדיקה שכבר רשום בקובץ, לפני שהסקריפט דורס אותו.
      # הוא קובע אם פעימת הלב של היום כבר נדחפה.
      - name: מתי נבדק לאחרונה
        id: prev
        run: |
          PREV=$(python3 -c "import json;d=json.load(open('data/tariffs.json'));print(((d.get('lastCheck') or {}).get('at') or '')[:10])")
          echo "date=$PREV" >> $GITHUB_OUTPUT
          echo "הבדיקה האחרונה שנרשמה: ${PREV:-אין}"

      - name: בדיקת התעריפים
        id: fetch
        run: |
          python3 scripts/fetch_tariffs.py \
            --data data/tariffs.json \
            ${{ inputs.url && format('--url {0}', inputs.url) || '' }}

      - name: דחיפת העדכון
        run: |
          git config user.name  "wattbill-tariff-bot"
          git config user.email "noreply@github.com"
          git add data/tariffs.json
          if git diff --staged --quiet; then
            echo "אין שינוי בקובץ – אין מה לדחוף."
            exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)
          if [ "${{ steps.fetch.outputs.changed }}" = "true" ]; then
            MSG="עדכון תעריפים אוטומטי: ${{ steps.fetch.outputs.summary }}"
          elif [ "${{ steps.prev.outputs.date }}" = "$TODAY" ]; then
            # היום כבר נבדק ונרשם. ארבעה מועדים ביום נועדו ליתירות,
            # לא לארבעה commits ביום – כאן עוצרים.
            echo "היום כבר נבדק ($TODAY) ואין שינוי בתעריפים – אין מה לדחוף."
            git restore --staged data/tariffs.json
            exit 0
          else
            # פעימת הלב היומית. חוץ מהוכחת חיים בריפו, היא מזינה את מחוון
            # "נבדק לאחרונה" באפליקציה ומאפסת את ספירת 60 הימים שאחריה
            # GitHub מכבה אוטומטית workflow מתוזמן בריפו ציבורי.
            MSG="בדיקת תעריפים: אין שינוי ($(date -u +%d/%m/%Y))"
          fi
          git commit -m "$MSG"
          # מועד אחר עלול היה לדחוף בינתיים; מושכים ומנסים שוב לפני כישלון.
          git push || { git pull --rebase && git push; }

      - name: סיכום
        if: always()
        run: |
          echo "### בדיקת תעריפים" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.fetch.outcome }}" != "success" ]; then
            echo "❌ הבדיקה נכשלה – הנתונים **לא** שונו. ראה את הפלט של השלב הקודם." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.fetch.outputs.changed }}" = "true" ]; then
            echo "✅ עודכן: ${{ steps.fetch.outputs.summary }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ אין שינוי בתעריפים." >> $GITHUB_STEP_SUMMARY
          fi
